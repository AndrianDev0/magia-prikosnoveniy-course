name: Portable server checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: course_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d course_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server --ignore-scripts --no-audit --no-fund
      - run: node --test server/test/*.test.mjs
        env:
          TEST_DATABASE_URL: postgresql://test:test-only-ci-password@127.0.0.1:5432/course_test
      - run: docker build -f deploy/Dockerfile -t magic-touch-test .
      - name: Validate deployment configuration
        run: |
          node server/setup.mjs course-ci.example.com ci@example.com > /dev/null
          docker compose --env-file deploy/.env.production -f deploy/compose.yaml config --quiet
          docker run --rm -e DOMAIN=course-ci.example.com -e TLS_EMAIL=ci@example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Smoke-test built server container
        run: |
          docker run -d --name course-smoke --network host --env-file deploy/.env.production -e NODE_ENV=test -e PUBLIC_ORIGIN=http://127.0.0.1:4189 -e DATABASE_URL=postgresql://test:test-only-ci-password@127.0.0.1:5432/course_test magic-touch-test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4189/healthz; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4189/healthz
          curl --fail http://127.0.0.1:4189/site-runtime.js | grep '"mode":"server"'
          curl --fail http://127.0.0.1:4189/admin | grep 'Вход администратора'
