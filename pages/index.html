<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#482817">
  <title>Магия прикосновений</title>
  <link rel="stylesheet" href="./styles.css?v=figma-png-v2">
  <script src="./app.js?v=figma-png-v2" defer></script>
</head>
<body>
  <main class="artwork home-artwork">
    <picture class="artwork-picture">
      <source media="(max-width:600px)" srcset="./course/home-mobile-figma.png" width="1140" height="5418">
      <img class="artwork-image" src="./course/home-desktop.svg" width="1920" height="5657" alt="Курс по тантрическому массажу «Магия прикосновений»">
    </picture>

    <nav class="hotspots" aria-label="Навигация">
      <a class="hotspot account" href="https://magia-prikosnoveniy.elizabethhilla266.chatgpt.site/profile" aria-label="Личный кабинет"></a>
      <a class="hotspot enter-course" href="https://magia-prikosnoveniy.elizabethhilla266.chatgpt.site/profile" aria-label="Зарегистрироваться и перейти к курсу"></a>
      <a class="hotspot plan-card-link plan-card-link-1" href="https://magia-prikosnoveniy.elizabethhilla266.chatgpt.site/profile?plan=standard&amp;pay=1" aria-label="Оплатить тариф Стандарт"></a>
      <a class="hotspot plan-card-link plan-card-link-2" href="https://magia-prikosnoveniy.elizabethhilla266.chatgpt.site/profile?plan=vip&amp;pay=1" aria-label="Оплатить тариф VIP"></a>
      <a class="hotspot plan-card-link plan-card-link-3" href="https://magia-prikosnoveniy.elizabethhilla266.chatgpt.site/profile?plan=vip-plus&amp;pay=1" aria-label="Оплатить тариф VIP плюс"></a>
      <button class="hotspot plan plan-1" data-plan-open aria-label="План тарифа Стандарт"></button>
      <button class="hotspot plan plan-2" data-plan-open aria-label="План тарифа VIP"></button>
      <button class="hotspot plan plan-3" data-plan-open aria-label="План тарифа VIP+"></button>
    </nav>

    <section class="mobile-carousel" data-index="1" aria-label="Тарифы">
      <div class="carousel-controls">
        <button data-prev aria-label="Предыдущий тариф">←</button>
        <div class="dots"><button data-dot="0"></button><button class="active" data-dot="1"></button><button data-dot="2"></button></div>
        <button data-next aria-label="Следующий тариф">→</button>
      </div>
      <div class="carousel-window"><div class="carousel-track">
        <article class="slide"><a href="https://magia-prikosnoveniy.elizabethhilla266.chatgpt.site/profile?plan=standard&amp;pay=1"><img src="./course/plan-standard.png" alt="Тариф Стандарт"></a><button data-plan-open>План курса</button></article>
        <article class="slide active"><a href="https://magia-prikosnoveniy.elizabethhilla266.chatgpt.site/profile?plan=vip&amp;pay=1"><img src="./course/plan-vip.png" alt="Тариф VIP"></a><button data-plan-open>План курса</button></article>
        <article class="slide"><a href="https://magia-prikosnoveniy.elizabethhilla266.chatgpt.site/profile?plan=vip-plus&amp;pay=1"><img src="./course/plan-vip-plus.png" alt="Тариф VIP плюс"></a><button data-plan-open>План курса</button></article>
      </div></div>
    </section>
    <button class="mobile-plan-open" data-plan-open aria-label="Открыть план курса"></button>
  </main>

  <button class="documents-reopen" type="button" aria-controls="documents">Документы</button>
  <div class="documents-layer" id="documents" hidden>
    <section class="documents-modal" tabindex="-1" role="dialog" aria-modal="true" aria-label="Ознакомление с документацией">
      <img class="documents-desktop-art" src="./course/documents-frame.svg" alt="" aria-hidden="true">
      <img class="documents-mobile-art" src="./course/documents-modal-figma.png" alt="" aria-hidden="true">
      <nav class="document-links" aria-label="Документы">
        <a href="./document.html?doc=offer" aria-label="Публичная оферта"></a>
        <a href="./document.html?doc=privacy" aria-label="Политика обработки персональных данных"></a>
        <a href="./document.html?doc=consent" aria-label="Согласие на обработку персональных данных"></a>
        <a href="./document.html?doc=rules" aria-label="Правила курса 18+"></a>
        <a href="./document.html?doc=refunds" aria-label="Правила возврата денежных средств"></a>
      </nav>
      <label class="consent consent-1"><input type="checkbox"><span class="sr-only">Принимаю условия публичной оферты</span></label>
      <label class="consent consent-2"><input type="checkbox"><span class="sr-only">Согласен на обработку персональных данных</span></label>
      <button class="documents-continue" disabled aria-label="Продолжить"></button>
    </section>
  </div>

  <dialog class="plan-modal" id="plan-modal">
    <picture><source media="(max-width:720px)" srcset="./course/plan-modal-mobile-figma.png"><img src="./course/plan-modal.svg" alt="План курса"></picture>
    <button class="plan-close" aria-label="Продолжить"></button>
  </dialog>
</body>
</html>
