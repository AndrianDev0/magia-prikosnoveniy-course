<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#482817">
  <title>Документ — Магия прикосновений</title>
  <link rel="stylesheet" href="./styles.css?v=legal-v2">
</head>
<body class="legal-body">
  <main class="legal-card">
    <p class="legal-brand">Эмиль</p>
    <p class="legal-eyebrow">Официальный документ · редакция 2.0</p>
    <h1 id="document-title">Загрузка документа…</h1>
    <div class="legal-content" id="document-content" aria-live="polite"></div>
    <nav class="legal-index" aria-label="Все документы курса">
      <a href="?doc=offer">Публичная оферта</a>
      <a href="?doc=privacy">Политика обработки персональных данных</a>
      <a href="?doc=consent">Согласие на обработку персональных данных</a>
      <a href="?doc=user-agreement">Пользовательское соглашение</a>
      <a href="?doc=rules-18">Правила курса 18+</a>
      <a href="?doc=refunds">Правила возврата денежных средств</a>
      <a href="?doc=testimonial-consent">Согласие на использование отзыва</a>
    </nav>
    <a class="legal-back" href="./">Вернуться на главную</a>
  </main>
  <script>
    const aliases={rules:'rules-18',agreement:'user-agreement'};
    const slug=aliases[new URLSearchParams(location.search).get('doc')]||new URLSearchParams(location.search).get('doc')||'offer';
    const escapeHtml=value=>String(value).replace(/[&<>"']/g,match=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[match]));
    fetch('./course/legal-documents.json').then(response=>{if(!response.ok)throw new Error('Документ не найден');return response.json()}).then(data=>{
      const legalDocument=data.documents[slug]; if(!legalDocument) throw new Error('Документ не найден');
      document.title=legalDocument.title+' — Магия прикосновений';
      document.querySelector('#document-title').textContent=legalDocument.title;
      document.querySelector('#document-content').innerHTML=legalDocument.blocks.map(block=>{
        if(block.type==='table')return `<div class="legal-table-wrap"><table class="legal-table"><thead><tr>${block.rows[0].map(cell=>`<th>${escapeHtml(cell)}</th>`).join('')}</tr></thead><tbody>${block.rows.slice(1).map(row=>`<tr>${row.map(cell=>`<td>${escapeHtml(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
        if(/^\d+\.\s/.test(block.text)||/Heading/i.test(block.style||''))return `<h2>${escapeHtml(block.text)}</h2>`;
        return `<p>${escapeHtml(block.text).replace(/\n/g,'<br>')}</p>`;
      }).join('');
    }).catch(error=>{document.querySelector('#document-title').textContent='Не удалось открыть документ';document.querySelector('#document-content').textContent=error.message});
  </script>
</body>
</html>
