<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#482817">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <title>Демо админки — Магия прикосновений</title>
  <link rel="stylesheet" href="./styles.css?v=admin-polish-v8">
  <link rel="stylesheet" href="./legal-compliance.css?v=legal-v16">
  <script src="./admin-demo.js?v=admin-polish-v19" defer></script>
</head>
<body class="demo-admin-body">
  <main class="demo-admin">
    <header class="demo-admin-header">
      <div><p>Магия прикосновений</p><h1>Заявки на оплату</h1></div>
      <a href="./">← На сайт</a>
    </header>
    <aside class="demo-admin-notice">Демо для просмотра интерфейса. Заявки сохраняются только в этом браузере и не доступны владельцу сайта с другого устройства. Смена статуса здесь не подтверждает реальный платёж.</aside>
    <p class="demo-admin-notice" data-storage-error role="alert" hidden></p>
    <section class="demo-admin-summary" aria-label="Статистика">
      <article><span>Всего заявок</span><strong data-total>0</strong></article>
      <article><span>Ожидают</span><strong data-pending>0</strong></article>
      <article><span>Подтверждены</span><strong data-confirmed>0</strong></article>
    </section>
    <div class="demo-admin-tools">
      <label class="demo-admin-search">Поиск по имени, почте или телефону<input type="search" data-search placeholder="Найти заявку" autocomplete="off"></label>
      <label class="demo-admin-filter">Статус<select data-filter><option value="all">Все заявки</option><option value="pending">Ожидают</option><option value="confirmed">Подтверждены</option><option value="rejected">Отклонены</option></select></label>
    </div>
    <p class="demo-admin-visible" data-visible-count role="status"></p>
    <section class="demo-admin-list" aria-live="polite" aria-label="Список заявок"></section>
    <template id="lead-template">
      <article class="demo-lead">
        <div class="demo-lead-main"><strong data-name></strong><span data-plan></span></div>
        <div class="demo-lead-contact"><a data-email></a><a data-phone></a></div>
        <time data-date></time>
        <label>Статус<select data-status><option value="pending">Ожидает</option><option value="confirmed">Оплата подтверждена</option><option value="rejected">Отклонена</option></select></label>
      </article>
    </template>
  </main>
</body>
</html>
