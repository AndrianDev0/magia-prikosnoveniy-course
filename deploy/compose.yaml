name: magic-touch
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: course
      POSTGRES_USER: course
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Generate .env.production first}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course -d course"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN}
      DATABASE_URL: postgresql://course:${DB_PASSWORD}@db:5432/course
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      TRUST_PROXY: "true"
      PAYMENT_MODE: ${PAYMENT_MODE:-disabled}
      PAYMENT_RECIPIENT: ${PAYMENT_RECIPIENT:-}
      QR_STANDARD_FILE: ${QR_STANDARD_FILE:-}
      QR_VIP_FILE: ${QR_VIP_FILE:-}
      QR_VIP_PLUS_FILE: ${QR_VIP_PLUS_FILE:-}
      QR_DIRECTORY: /payment-assets
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-emil_ka@list.ru}
    volumes:
      - ./payment-assets:/payment-assets:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4189/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      TLS_EMAIL: ${TLS_EMAIL:?Set TLS_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  database:
  caddy_data:
  caddy_config:
